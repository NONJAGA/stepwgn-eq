name: Build Stepwgn NR-MZ25 13-Band DSQ APK
on: [push, workflow_dispatch]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Compile APK
        run: |
          PROJECT_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          cd "$(dirname "$PROJECT_FILE")"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/Stepwgn_NRMZ25_13Band_DSQ.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stepwgn-NRMZ25-13Band-DSQ-APK
          path: Stepwgn_NRMZ25_13Band_DSQ.apk
